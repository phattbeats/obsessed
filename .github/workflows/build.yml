name: Build & Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USER }}/obsessed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # PHA-1349 added Find a Grave parsing that uses BeautifulSoup with the
          # 'lxml' parser explicitly, so the gate must install lxml now.
          # lxml is pinned in requirements.txt; we install it explicitly here
          # (bypassing the historical smoke-only filter) so the native build
          # is intentional and visible in the workflow log.
          pip install -r requirements.txt pytest==8.3.3 pytest-asyncio==0.24.0

      - name: Run pytest (smoke + schema gate)
        # tests/ui/ targets the live container on the self-hosted runner's LAN
        # (unreachable from a GitHub runner) and runs in the dedicated ui-test job.
        #
        # The four scraper test files (instagram/people_search/scraper_cache/tiktok)
        # were previously quarantined here after drifting from their modules and
        # keeping this gate RED, which froze the deployed image (PHA-1027 / PHA-1042).
        # Repaired against the current scraper modules in PHA-1042 and returned to the
        # gate. Do NOT add new ignores without a tracking issue.
        run: |
          pytest -q --ignore=tests/ui

  # ui-test runs on demand (workflow_dispatch) or when 'ui-test' is in the commit message.
  # It tests against the live container on the self-hosted runner's LAN, so it cannot
  # run in a standard push CI — the container is not reachable from GitHub runners.
  ui-test:
    needs: []   # runs independently; build job does not block on it
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'ui-test') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install playwright pytest pytest-asyncio httpx
          playwright install chromium --with-deps

      - name: Run Playwright UI tests
        env:
          PLAYWRIGHT_BASE_URL: http://10.0.0.100:10198
        run: |
          pytest tests/ui/test_trivia_game.py -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
